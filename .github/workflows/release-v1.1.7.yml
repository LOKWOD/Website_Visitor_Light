name: Release Visitor Light v1.1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.7.yml'
      - '.github/scripts/prepare-v1.1.7.py'
  pull_request:
    paths:
      - '.github/workflows/release-v1.1.7.yml'
      - '.github/scripts/prepare-v1.1.7.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-light-v1-1-7-release
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Prepare v1.1.7 source
        shell: bash
        run: |
          if grep -Fq 'constexpr char kFirmwareVersion[] = "1.1.3";' firmware/src/main.cpp; then
            git apply --check --recount firmware/patches/v1.1.4-saveable-passwords.patch
            git apply --recount firmware/patches/v1.1.4-saveable-passwords.patch
          fi
          python .github/scripts/prepare-v1.1.7.py
          grep -F 'constexpr char kFirmwareVersion[] = "1.1.7";' firmware/src/main.cpp
          grep -F 'Approximate area' firmware/src/main.cpp
          grep -F '/v1/firmware/latest' firmware/src/main.cpp

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('firmware/src/main.cpp').read_text(encoding='utf-8')
          start = source.index('<script>') + len('<script>')
          end = source.index('</script>', start)
          Path('/tmp/visitor-light-dashboard.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/visitor-light-dashboard.js

      - name: Supply non-secret build configuration
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h

      - name: Compile ESP32-S3 firmware
        run: pio run -d firmware -e esp32-s3-devkitc-1

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('firmware/src/main.cpp').read_text(encoding='utf-8')
          match = re.search(r'kFirmwareVersion\[\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', source)
          if not match:
              raise SystemExit('Could not find kFirmwareVersion')
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        run: |
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin LOKWOD_Visitor_Light.bin
          sha256sum LOKWOD_Visitor_Light.bin > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOKWOD-Visitor-Light-v${{ steps.version.outputs.version }}
          path: |
            LOKWOD_Visitor_Light.bin
            SHA256SUMS.txt

      - name: Publish v1.1.7 release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          NOTES="LOKWOD Website Visitor Light v$VERSION. Emergency dashboard recovery: fixes the v1.1.6 JavaScript parsing bug that left live dashboard fields stuck at -- / Loading status. Keeps Cloudflare-routed firmware updates and the approximate visitor-area UI."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LOKWOD_Visitor_Light.bin SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" LOKWOD_Visitor_Light.bin SHA256SUMS.txt --target "$GITHUB_SHA" --title "LOKWOD Visitor Light v$VERSION" --notes "$NOTES"
          fi
