name: Release Visitor Light v1.1.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.12.yml'
      - 'firmware/src/main.cpp'
      - 'firmware/include/**'
      - 'firmware/platformio.ini'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-light-v1-1-12-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dashboard JavaScript and connection-close repair
        shell: bash
        run: |
          grep -F 'constexpr char kFirmwareVersion[] = "1.1.12";' firmware/src/main.cpp
          grep -F 'void closeDashboardConnectionAfterResponse()' firmware/src/main.cpp
          grep -F 'webServer.sendHeader("Connection", "close");' firmware/src/main.cpp
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('firmware/src/main.cpp', 'utf8');
          const start = source.indexOf('<script>') + '<script>'.length;
          const end = source.indexOf('</script>', start);
          if (start < '<script>'.length || end < 0) throw new Error('Dashboard script not found.');
          new Function(source.slice(start, end));
          console.log('Dashboard JavaScript syntax OK.');
          NODE

  firmware:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Supply non-secret build configuration
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h

      - name: Compile ESP32-S3 firmware
        run: pio run -d firmware -e esp32-s3-devkitc-1

      - name: Prepare release asset
        run: |
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin LOKWOD_Visitor_Light.bin
          sha256sum LOKWOD_Visitor_Light.bin > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOKWOD-Visitor-Light-v1.1.12
          path: |
            LOKWOD_Visitor_Light.bin
            SHA256SUMS.txt

      - name: Publish v1.1.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="LOKWOD Website Visitor Light v1.1.12. Closes every local dashboard HTTP connection after its response so a browser cannot monopolize the ESP32 web server or delay the Windows Visitor Key companion. Preserves visitor flashing, history, affiliate-click alerts, heartbeat, saved credentials, and Cloudflare-proxied OTA updates."
          if gh release view v1.1.12 >/dev/null 2>&1; then
            gh release upload v1.1.12 LOKWOD_Visitor_Light.bin SHA256SUMS.txt --clobber
            gh release edit v1.1.12 --notes "$NOTES"
          else
            git tag v1.1.12
            git push origin v1.1.12
            gh release create v1.1.12 LOKWOD_Visitor_Light.bin SHA256SUMS.txt --title "LOKWOD Visitor Light v1.1.12" --notes "$NOTES"
          fi
