name: Build and publish visitor light firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-light-firmware-release
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Prepare release source
        shell: bash
        run: |
          if grep -Fq 'constexpr char kFirmwareVersion[] = "1.1.3";' firmware/src/main.cpp; then
            echo "Applying v1.1.4 saveable-password/dashboard-login compatibility patch."
            git apply --check --recount firmware/patches/v1.1.4-saveable-passwords.patch
            git apply --recount firmware/patches/v1.1.4-saveable-passwords.patch
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('firmware/src/main.cpp')
          source = path.read_text(encoding='utf-8')

          old_version = 'constexpr char kFirmwareVersion[] = "1.1.4";'
          new_version = 'constexpr char kFirmwareVersion[] = "1.1.5";'
          if old_version not in source:
              raise SystemExit('Expected v1.1.4 source after compatibility preparation.')
          source = source.replace(old_version, new_version, 1)

          old_colors = '<section class="card"><h2>Site colors</h2><div class="legend"><div><i class="dot" style="background:rgb(0,185,255)"></i>Nautical Dream</div><div><i class="dot" style="background:rgb(0,82,255)"></i>LOKWOD</div><div><i class="dot" style="background:rgb(0,235,95)"></i>Life Simulation</div><div><i class="dot" style="background:rgb(180,35,255)"></i>Beautiful Men\'s Club</div><div><i class="dot" style="background:rgb(255,96,0)"></i>Mr Adventure Dad</div><div><i class="dot" style="background:rgb(255,174,0)"></i>Syracuse Appraiser</div><div><i class="dot" style="background:rgb(235,235,235);border:1px solid #aaa"></i>Accurate Appraisals</div></div></section>'
          new_colors = '<section class="card"><h2>Site colors</h2><div class="legend"><div><i class="dot" style="background:rgb(0,185,255)"></i>Nautical Dream</div><div><i class="dot" style="background:rgb(0,82,255)"></i>LOKWOD</div><div><i class="dot" style="background:rgb(0,235,95)"></i>Life Simulation</div><div><i class="dot" style="background:rgb(180,35,255)"></i>Beautiful Men\'s Club</div><div><i class="dot" style="background:rgb(255,96,0)"></i>Mr Adventure Dad</div><div><i class="dot" style="background:rgb(255,174,0)"></i>Syracuse Appraiser</div><div><i class="dot" style="background:rgb(235,235,235);border:1px solid #aaa"></i>Accurate Appraisals</div><div><i class="dot" style="background:transparent;border:1px dashed #9aa7b7"></i>Dish Gal</div></div></section>'
          if old_colors not in source:
              raise SystemExit('Could not find the Site colors block for the v1.1.5 test update.')
          source = source.replace(old_colors, new_colors, 1)

          path.write_text(source, encoding='utf-8')
          print('Prepared Visitor Light v1.1.5 with blank Dish Gal site-color entry.')
          PY

          grep -F 'constexpr char kFirmwareVersion[]' firmware/src/main.cpp
          grep -F 'Dish Gal' firmware/src/main.cpp

      - name: Add GitHub TLS trust anchors
        shell: bash
        run: |
          curl -fsSL https://cacerts.digicert.com/DigiCertGlobalRootCA.crt.pem -o /tmp/DigiCertGlobalRootCA.pem
          curl -fsSL https://cacerts.digicert.com/DigiCertTrustedRootG4.crt.pem -o /tmp/DigiCertTrustedRootG4.pem

          echo '43:48:A0:E9:44:4C:78:CB:26:5E:05:8D:5E:89:44:B4:D8:4F:96:62:BD:26:DB:25:7F:89:34:A4:43:C7:01:61' > /tmp/global-root.expected
          echo '55:2F:7B:DC:F1:A7:AF:9E:6C:E6:72:01:7F:4F:12:AB:F7:72:40:C7:8E:76:1A:C2:03:D1:D9:D2:0A:C8:99:88' > /tmp/trusted-g4.expected
          openssl x509 -in /tmp/DigiCertGlobalRootCA.pem -noout -fingerprint -sha256 | cut -d= -f2 | grep -Fxf /tmp/global-root.expected
          openssl x509 -in /tmp/DigiCertTrustedRootG4.pem -noout -fingerprint -sha256 | cut -d= -f2 | grep -Fxf /tmp/trusted-g4.expected

          python - <<'PY'
          from pathlib import Path

          bundle_path = Path('firmware/include/trusted_roots.h')
          bundle = bundle_path.read_text(encoding='utf-8')
          marker = ')LOKWOD_CERTS";'
          if marker not in bundle:
              raise SystemExit('Could not locate trusted-root bundle terminator.')

          for certificate_path in (
              Path('/tmp/DigiCertGlobalRootCA.pem'),
              Path('/tmp/DigiCertTrustedRootG4.pem'),
          ):
              certificate = certificate_path.read_text(encoding='utf-8').strip()
              if certificate not in bundle:
                  bundle = bundle.replace(marker, certificate + '\n' + marker, 1)

          bundle_path.write_text(bundle, encoding='utf-8')
          print('Added DigiCert Global Root CA and Trusted Root G4 for GitHub HTTPS.')
          PY

      - name: Supply non-secret build configuration
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h

      - name: Compile ESP32-S3 firmware
        run: pio run -d firmware -e esp32-s3-devkitc-1

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('firmware/src/main.cpp').read_text(encoding='utf-8')
          match = re.search(r'kFirmwareVersion\[\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', source)
          if not match:
              raise SystemExit('Could not find kFirmwareVersion in firmware/src/main.cpp')
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Prepare release asset
        shell: bash
        run: |
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin LOKWOD_Visitor_Light.bin
          sha256sum LOKWOD_Visitor_Light.bin > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOKWOD-Visitor-Light-v${{ steps.version.outputs.version }}
          path: |
            LOKWOD_Visitor_Light.bin
            SHA256SUMS.txt

      - name: Publish stable GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; compile verified, no duplicate release created."
            exit 0
          fi

          if gh release create "$TAG" \
            LOKWOD_Visitor_Light.bin \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LOKWOD Visitor Light v$VERSION" \
            --notes "Stable LOKWOD Website Visitor Light firmware v$VERSION. Test update: adds Dish Gal as an unassigned entry in the Site Colors list and includes the corrected GitHub TLS trust chain. Devices running the v1.1.4 GitHub-TLS hotfix or newer can install this release automatically over HTTPS."; then
            echo "Published release $TAG."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG was created by another run."
            exit 0
          fi

          echo "Failed to publish release $TAG."
          exit 1
