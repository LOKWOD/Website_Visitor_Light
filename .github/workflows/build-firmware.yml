name: Build and publish visitor light firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-light-firmware-release
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Prepare release source
        shell: bash
        run: |
          if grep -Fq 'constexpr char kFirmwareVersion[] = "1.1.3";' firmware/src/main.cpp; then
            echo "Applying v1.1.4 saveable-password/dashboard-login patch."
            git apply firmware/patches/v1.1.4-saveable-passwords.patch
          else
            echo "Source is newer than the v1.1.3 baseline; no compatibility patch needed."
          fi

      - name: Supply non-secret build configuration
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h

      - name: Compile ESP32-S3 firmware
        run: pio run -d firmware -e esp32-s3-devkitc-1

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('firmware/src/main.cpp').read_text(encoding='utf-8')
          match = re.search(r'kFirmwareVersion\[\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', source)
          if not match:
              raise SystemExit('Could not find kFirmwareVersion in firmware/src/main.cpp')
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Prepare release asset
        shell: bash
        run: |
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin LOKWOD_Visitor_Light.bin
          sha256sum LOKWOD_Visitor_Light.bin > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOKWOD-Visitor-Light-v${{ steps.version.outputs.version }}
          path: |
            LOKWOD_Visitor_Light.bin
            SHA256SUMS.txt

      - name: Publish stable GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; compile verified, no duplicate release created."
            exit 0
          fi

          if gh release create "$TAG" \
            LOKWOD_Visitor_Light.bin \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LOKWOD Visitor Light v$VERSION" \
            --notes "Stable LOKWOD Website Visitor Light firmware v$VERSION. Devices running v1.1.3 or newer check the latest stable GitHub Release automatically and install newer versions over HTTPS."; then
            echo "Published release $TAG."
            exit 0
          fi

          # A near-simultaneous run may have created the same release after the
          # first existence check. Treat that as success rather than a false CI failure.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG was created by another run."
            exit 0
          fi

          echo "Failed to publish release $TAG."
          exit 1
